# Norn fork gates (see NORN.md). Upstream workflows are left untouched.
name: Norn

permissions:
  contents: read

on:
  push:
    branches: ['norn/**']
    tags: ['norn-v*']
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Pinned toolchain; bump deliberately together with a new norn-v* tag.
  RUST_TOOLCHAIN: '1.98.0'

concurrency:
  group: norn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-default:
    name: upstream tests (native, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: norn-native
      # Same exclusions as upstream rust.yaml (language bindings are built by their own workflows).
      - run: cargo test --workspace --exclude zen-ffi --exclude zen-nodejs --exclude zen-python --locked

  pure-profile:
    name: pure profile (no-default-features; native + wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: norn-pure
      - name: native unit tests without js/http/schema-resolvers/json-schema
        run: cargo test -p zen-engine --no-default-features --lib --locked
      - name: native unit tests with json-schema but without schema-resolvers (C6 typed $ref errors)
        run: cargo test -p zen-engine --no-default-features --features json-schema --lib --locked
      - name: expression integration tests with the pure regex backend (regex-lite)
        run: cargo test -p zen-expression --no-default-features --tests --locked
      - name: assert reqwest / tokio / rquickjs are absent from the pure native tree
        run: |
          set -euo pipefail
          # Positive control: the default native tree must contain all three.
          default_tree="$(cargo tree -e normal -p zen-engine --locked)"
          for crate in reqwest tokio rquickjs; do
            grep -qE "(^|[^A-Za-z0-9_-])${crate} v[0-9]" <<<"$default_tree" || { echo "::error::positive control: ${crate} missing from default native tree"; exit 1; }
          done
          if cargo tree -e normal -p zen-engine --no-default-features --locked | grep -E '(^|[^A-Za-z0-9_-])(reqwest|tokio|rquickjs) v[0-9]'; then
            echo "::error::reqwest, tokio or rquickjs present in the --no-default-features native dependency tree"
            exit 1
          fi
      - name: build for wasm32-unknown-unknown (no libclang required)
        run: cargo build -p zen-engine --no-default-features --target wasm32-unknown-unknown --release --locked
      - name: build the zen-expression Norn profile alone for wasm32-unknown-unknown (C7)
        run: cargo build -p zen-expression --no-default-features --features regex-lite,deterministic-maps,metering --target wasm32-unknown-unknown --release --locked
      - name: assert getrandom is absent from the zen-expression Norn profile wasm tree (C7)
        run: |
          set -euo pipefail
          # Positive control: the default tree seeds ahash from getrandom.
          cargo tree -e normal --target wasm32-unknown-unknown -p zen-expression --locked | grep -qE '(^|[^A-Za-z0-9_-])getrandom v[0-9]'
          if cargo tree -e normal --target wasm32-unknown-unknown -p zen-expression --no-default-features --features regex-lite,deterministic-maps,metering --locked | grep -E '(^|[^A-Za-z0-9_-])(getrandom|tokio|rquickjs|reqwest|regex) v[0-9]'; then
            echo "::error::getrandom, a runtime or the regex backend is present in the zen-expression Norn profile wasm32 tree"
            exit 1
          fi
      - name: assert tokio / rquickjs are absent from the pure wasm tree
        run: |
          set -euo pipefail
          # Positive control: the default tree must contain them, so the negative check is not vacuous.
          cargo tree -e features --target wasm32-unknown-unknown -p zen-engine --locked | grep -qiE 'tokio|rquickjs'
          if cargo tree -e features --target wasm32-unknown-unknown -p zen-engine --no-default-features --locked | grep -iE 'tokio|rquickjs'; then
            echo "::error::tokio or rquickjs present in the --no-default-features wasm32 dependency tree"
            exit 1
          fi

  semantic-features:
    name: Norn semantic features on (strict-errors, deterministic-maps, metering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: norn-semantic
      - name: upstream + Norn tests, default features plus the semantic patches
        run: cargo test --workspace --exclude zen-ffi --exclude zen-nodejs --exclude zen-python --features "$NORN_SEMANTIC" --locked
      - name: pure profile plus the semantic patches
        run: |
          cargo test -p zen-engine --no-default-features --features "$NORN_SEMANTIC" --lib --test strict_errors --test metering --locked
          cargo test -p zen-expression --no-default-features --features deterministic-maps,metering --test deterministic_maps --test metering --locked
    env:
      NORN_SEMANTIC: zen-engine/strict-errors,zen-engine/deterministic-maps,zen-engine/metering,zen-expression/deterministic-maps,zen-expression/metering

  metering-wasm:
    name: Norn profile on wasm32-unknown-unknown (metering counts, engine build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: norn-metering-wasm
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | awk -F'"' '/^version/ {print $2}')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # The same pinned unit counts as the native run in `semantic-features`.
      - name: metering tests on wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p zen-expression --no-default-features --features metering --target wasm32-unknown-unknown --test metering --locked
      # The Norn kernel profile: pure (no js/http/schema-resolvers) plus all three
      # semantic patches, as the kernel will build it for Workers / Durable Objects.
      - name: build zen-engine Norn profile for wasm32-unknown-unknown
        run: cargo build -p zen-engine --no-default-features --features strict-errors,deterministic-maps,metering --target wasm32-unknown-unknown --release --locked
      - name: assert tokio / rquickjs / reqwest are absent from the Norn profile wasm tree
        run: |
          set -euo pipefail
          if cargo tree -e normal --target wasm32-unknown-unknown -p zen-engine --no-default-features --features strict-errors,deterministic-maps,metering --locked | grep -E '(^|[^A-Za-z0-9_-])(tokio|rquickjs|reqwest) v[0-9]'; then
            echo "::error::runtime dependency in the Norn profile wasm32 tree"
            exit 1
          fi
      # C8: jsonschema enables getrandom `wasm_js` on wasm32; the Norn profile (no
      # `json-schema`) has neither. Positive control: `json-schema` brings both back.
      - name: assert getrandom / jsonschema / swc / smartstring are absent from the Norn profile trees (C8, C9)
        run: |
          set -euo pipefail
          profile=strict-errors,deterministic-maps,metering,regex-lite
          has() { grep -qE "(^|[^A-Za-z0-9_-])($1) v[0-9]" <<<"$2"; }
          # Each tree is a checked assignment, so a cargo tree failure fails the step.
          with_schema="$(cargo tree -e normal --target wasm32-unknown-unknown -p zen-engine --no-default-features --features "${profile},json-schema" --locked)"
          with_ts="$(cargo tree -e normal --target wasm32-unknown-unknown -p zen-engine --no-default-features --features "${profile},ts-types" --locked)"
          wasm="$(cargo tree -e normal --target wasm32-unknown-unknown -p zen-engine --no-default-features --features "${profile}" --locked)"
          native="$(cargo tree -e normal --target x86_64-unknown-linux-gnu -p zen-engine --no-default-features --features "${profile}" --locked)"
          # Positive controls: json-schema brings jsonschema + getrandom back, ts-types swc + smartstring.
          for crate in getrandom jsonschema; do
            has "${crate}" "$with_schema" || { echo "::error::positive control: ${crate} missing with json-schema"; exit 1; }
          done
          for crate in swc_ecma_parser smartstring; do
            has "${crate}" "$with_ts" || { echo "::error::positive control: ${crate} missing with ts-types"; exit 1; }
          done
          # The profile trees must be non-empty and contain zen-engine itself.
          has zen-engine "$wasm" && has zen-engine "$native" || { echo "::error::empty Norn profile tree"; exit 1; }
          if has 'getrandom|jsonschema|swc_[a-z_]+|smartstring' "$wasm"; then
            echo "::error::getrandom, jsonschema, swc or smartstring present in the Norn profile wasm32 tree"
            exit 1
          fi
          if has 'jsonschema|swc_[a-z_]+|smartstring' "$native"; then
            echo "::error::jsonschema, swc or smartstring present in the Norn profile native tree"
            exit 1
          fi
