[package]
name = "zen-types"
description = "Zen Core Types"
version = "2.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/gorules/zen.git"
homepage = "https://gorules.io"

[dependencies]
ahash = { workspace = true }
serde = { workspace = true, features = ["rc", "derive"] }
serde_json = { workspace = true, features = [] }
smallvec = { version = "1", features = ["union"] }
hipstr = { version = "0.8", features = ["serde"] }
rust_decimal = { workspace = true, features = ["maths-nopanic"] }
rust_decimal_macros = { workspace = true }
thiserror = { workspace = true }
nohash-hasher = { workspace = true }
indexmap = { version = "2", optional = true }

[features]
default = ["runtime-rng"]
# Norn (C7, default on = upstream): seed ahash maps from the OS RNG (getrandom). Without
# it ahash uses fixed seeds, so wasm32-unknown-unknown needs no JS entropy import.
runtime-rng = ["ahash/runtime-rng"]
arbitrary_precision = ["serde_json/arbitrary_precision"]
# Norn semantic patch (default off; see NORN.md): insertion-ordered VariableMap above
# the small-map threshold, so iteration order never depends on a hash seed.
deterministic-maps = ["dep:indexmap"]
