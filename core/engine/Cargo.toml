[package]
authors = ["GoRules Team <bot@gorules.io>"]
description = "Business rules engine"
name = "zen-engine"
license = "MIT"
version = "2.0.1"
edition = "2021"
repository = "https://github.com/gorules/zen.git"
homepage = "https://gorules.io"

[lib]
doctest = false

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
thiserror = { workspace = true }
petgraph = { workspace = true }
serde_json = { workspace = true, features = [] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_path_to_error = "0.1"
strum = { workspace = true, features = ["derive"] }
once_cell = { workspace = true }
json_dotpath = { workspace = true }
rust_decimal = { workspace = true, features = ["maths-nopanic"] }
fixedbitset = "0.5"
tokio = { workspace = true, features = ["sync", "time"], optional = true }
rquickjs = { version = "0.10", features = ["macro", "loader", "rust-alloc", "futures", "either", "properties"], optional = true }
zen-types = { path = "../types", version = "2.0.1", default-features = false }
zen-expression = { path = "../expression", version = "2.0.1", default-features = false }
zen-tmpl = { path = "../template", version = "2.0.1", default-features = false }
nohash-hasher = { workspace = true }
downcast-rs = { version = "2.0", features = ["std", "sync"] }
arc-swap = "1"
flate2 = { version = "1", features = ["rust_backend"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
swc_ts_fast_strip = { version = "53.0.0", optional = true }
# Norn (C9): the TypeScript parser is optional behind `ts-types` (function-node type
# declarations in workspace analysis, and `js` type stripping).
swc_common = { version = "23", optional = true }
swc_ecma_parser = { version = "41", optional = true }
swc_ecma_ast = { version = "25", optional = true }
# Norn (C8): only the jsonschema adapter (`nodes::variable_json`) uses these.
typed-arena = { version = "2", optional = true }
self_cell = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1.43", features = ["yaml", "redactions"] }
toml = "0.8"
mimalloc = "0.1.52"

# Norn: tokio-based test/bench harness is native-only (rt-multi-thread cannot run on
# wasm anyway); keeps `cargo tree --target wasm32-unknown-unknown` free of tokio.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true, features = ["async_tokio"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait = { version = "0.1", optional = true }
http = { version = "1.3", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
reqsign = { version = "0.20", features = ["aws", "azure", "google", "default-context"], optional = true }
sha2 = { version = "0.10", optional = true }
# Norn: jsonschema's default features (HTTP + file `$ref` resolvers with reqwest/tokio/TLS)
# are only enabled by the `schema-resolvers` feature, through the native-only helper
# crate below. Without it an external `$ref` fails with `SchemaCompileError`.
jsonschema = { version = "0.49", default-features = false, optional = true }
zen-schema-resolvers = { path = "../schema-resolvers", version = "2.0.1", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Norn (C8): optional behind `json-schema`. On wasm32 jsonschema enables getrandom `wasm_js`.
jsonschema = { version = "0.49", default-features = false, optional = true }
rquickjs = { version = "0.10", features = ["macro", "loader", "rust-alloc", "futures", "either", "properties", "bindgen"], optional = true }

# Norn: wasm-safe monotonic clock. std::time::Instant traps on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[[bench]]
harness = false
name = "engine"

[features]
# Norn: upstream behaviour is the default. `--no-default-features` yields the pure
# evaluator profile (no QuickJS, no tokio, no native HTTP). See NORN.md.
default = ["js", "http", "json-schema", "schema-resolvers", "ts-types", "regex-deprecated", "runtime-rng"]
# Norn (C7): seed ahash maps from the OS RNG (upstream behaviour). See zen-types `runtime-rng`.
runtime-rng = ["ahash/runtime-rng", "zen-types/runtime-rng", "zen-expression/runtime-rng", "zen-tmpl/runtime-rng"]
# Function node (JavaScript/TypeScript) execution via QuickJS. Without it, function
# nodes fail with `UnsupportedNodeError`.
js = ["dep:rquickjs", "dep:tokio", "dep:swc_ts_fast_strip", "ts-types"]
# Native (non-wasm) HTTP client + cloud request signing for the function-node `http`
# module. Implies `js`. A host-provided `HttpHandler` works without it.
http = ["js", "dep:reqwest", "dep:reqsign", "dep:sha2", "dep:http", "dep:async-trait"]
# Regex backend for zen-expression / zen-tmpl (exactly as upstream: regex by default).
# jsonschema's default HTTP/file `$ref` resolvers (native only; upstream behaviour).
schema-resolvers = ["json-schema", "dep:zen-schema-resolvers"]
# Norn (C8): JSON Schema validation of input/output node `schema` (jsonschema, Draft 7;
# upstream behaviour, default on). Without it a node that declares a schema fails with
# the typed `SchemaCompileError { unresolved_reference: false, .. }` instead of being
# validated, and the dependency tree has no jsonschema (on wasm32: no getrandom).
json-schema = ["dep:jsonschema", "dep:typed-arena", "dep:self_cell"]
# Norn (C9): TypeScript type declarations of function nodes in workspace analysis
# (swc parser; upstream behaviour, default on, implied by `js`). Without it a declared
# function type is not parsed and the function's output type stays unresolved, as for a
# function without a declaration. swc_ecma_parser pulls smartstring (MPL-2.0).
ts-types = ["dep:swc_common", "dep:swc_ecma_parser", "dep:swc_ecma_ast"]
regex-deprecated = ["zen-expression/regex-deprecated", "zen-tmpl/regex-deprecated"]
regex-lite = ["zen-expression/regex-lite", "zen-tmpl/regex-lite"]
bindgen = ["js", "rquickjs/bindgen"]
# Norn semantic patches (default off; see NORN.md). Decision-table cell and switch-condition
# failures abort evaluation with `StrictEvaluationError` instead of being a non-match.
strict-errors = []
# Insertion-ordered VariableMap at every size (object/keys/values order independent of hash seeds).
deterministic-maps = ["zen-expression/deterministic-maps", "zen-types/deterministic-maps"]
# Deterministic operation budget: VM opcodes, expensive builtins, graph node and table row
# visits. See `Decision::evaluate_metered` and `EvaluationError::BudgetExhausted`.
metering = ["zen-expression/metering"]
arbitrary_precision = ["serde_json/arbitrary_precision", "zen-expression/arbitrary_precision", "zen-types/arbitrary_precision", "zen-tmpl/arbitrary_precision"]
# Norn S5: deterministic temporal expression profile.
deterministic-temporal = ["zen-expression/deterministic-temporal"]
# Norn S7: bounded string tokenization, Unicode-scalar prefixes, and joins.
bounded-strings = ["zen-expression/bounded-strings", "zen-tmpl/bounded-strings"]
