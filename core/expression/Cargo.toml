[package]
authors = ["GoRules Team <bot@gorules.io>"]
description = "Zen Expression Language"
name = "zen-expression"
license = "MIT"
version = "2.0.1"
edition = "2021"
repository = "https://github.com/gorules/zen.git"
homepage = "https://gorules.io"

[dependencies]
smallvec = { version = "1", features = ["union"] }
anyhow = { workspace = true }
ahash = { workspace = true }
bumpalo = { workspace = true, features = ["collections"] }
chrono = { workspace = true }
chrono-tz = "0.10"
humantime = { workspace = true }
fastrand = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true, optional = true }
# Norn: non-optional so `default-features = false` still has a regex backend.
regex-lite = { workspace = true }
serde = { workspace = true, features = ["rc", "derive"] }
serde_json = { workspace = true, features = [] }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true, features = ["maths-nopanic"] }
rust_decimal_macros = { workspace = true }
nohash-hasher = { workspace = true }
strsim = "0.11"
iana-time-zone = "0.1"

zen-macros = { path = "../macros", version = "2.0.1" }
zen-types = { path = "../types", version = "2.0.1", default-features = false }

[dev-dependencies]
csv = "1"
serde_json5 = "0.2"
toml = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
recursive = { workspace = true }

# Norn: criterion (rayon) cannot build for wasm; benches are native-only anyway.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { workspace = true }

# Norn: runs the `metering` determinism tests on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
# ahash's runtime RNG needs a JS entropy source on wasm32-unknown-unknown (zen-engine
# gets the same feature through jsonschema).
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["regex-deprecated", "runtime-rng"]
# Norn (C7): see zen-types `runtime-rng`.
runtime-rng = ["ahash/runtime-rng", "zen-types/runtime-rng"]
regex-lite = []
regex-deprecated = ["dep:regex"]
arbitrary_precision = ["serde_json/arbitrary_precision", "zen-types/arbitrary_precision"]
# Norn: see zen-types `deterministic-maps`.
deterministic-maps = ["zen-types/deterministic-maps"]
# Norn semantic patch (default off; see NORN.md): deterministic operation budget (`meter`).
metering = []
# Norn S5: strict, pure calendar dates and UTC instants; legacy temporal APIs disabled.
deterministic-temporal = ["zen-types/deterministic-temporal"]
# Norn S7: bounded string tokenization, Unicode-scalar prefixes, and joins.
bounded-strings = []

[[bench]]
harness = false
name = "lexer"

[[bench]]
harness = false
name = "standard"

[[bench]]
harness = false
name = "unary"

[[bench]]
harness = false
name = "isolate"
