[package]
authors = ["GoRules Team <bot@gorules.io>"]
description = "Zen Template Language"
name = "zen-tmpl"
license = "MIT"
version = "2.0.1"
edition = "2021"
repository = "https://github.com/gorules/zen.git"
homepage = "https://gorules.io"

[dependencies]
zen-expression = { path = "../expression", version = "2.0.1", default-features = false }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["regex-deprecated", "runtime-rng"]
# Norn (C7): see zen-types `runtime-rng`.
runtime-rng = ["zen-expression/runtime-rng"]

regex-lite = ["zen-expression/regex-lite"]
regex-deprecated = ["zen-expression/regex-deprecated"]
arbitrary_precision = ["zen-expression/arbitrary_precision"]
# Norn S5: deterministic temporal expression profile.
deterministic-temporal = ["zen-expression/deterministic-temporal"]
# Norn S7: bounded string tokenization, Unicode-scalar prefixes, and joins.
bounded-strings = ["zen-expression/bounded-strings"]
